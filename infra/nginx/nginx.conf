user nginx;
pid /var/run/nginx.pid;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
  multi_accept on;
  worker_connections 65535;
}

http {
  charset utf-8;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  server_tokens off;
  log_not_found off;
  types_hash_max_size 2048;
  client_max_body_size 16M;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Logging format with upstream latency
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

  # Rate limiting zones
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
  limit_conn_zone $binary_remote_addr zone=addr_conn:10m;

  # Upstream definitions (Docker service names)
  upstream web_upstream {
    server web:3000;
    keepalive 32;
  }

  upstream admin_upstream {
    server admin:3001;
    keepalive 32;
  }

  upstream api_upstream {
    server api:4000;
    keepalive 32;
  }

  # Common proxy headers
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  # 1. Main Public Site (finallinks.com, www, and default catch-all)
  server {
    listen 80 default_server;
    server_name finallinks.com www.finallinks.com localhost;

    # Global security headers for public site
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Static assets caching
    location /_next/static/ {
      proxy_pass http://web_upstream;
      proxy_cache_bypass $http_upgrade;
      expires 365d;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API reverse proxy
    location /api/ {
      proxy_pass http://api_upstream;
      limit_req zone=api_general burst=20 nodelay;
      limit_conn addr_conn 20;
    }

    # API auth endpoints with stricter rate limiting
    location /api/v1/auth/login {
      proxy_pass http://api_upstream;
      limit_req zone=auth_limit burst=5 nodelay;
    }

    location /api/v1/auth/register {
      proxy_pass http://api_upstream;
      limit_req zone=auth_limit burst=5 nodelay;
    }

    # Public web pages
    location / {
      proxy_pass http://web_upstream;
      limit_conn addr_conn 40;
    }
  }

  # 2. Super Admin Panel (admin.finallinks.com)
  server {
    listen 80;
    server_name admin.finallinks.com;

    # Strict clickjacking defense for admin
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location /_next/static/ {
      proxy_pass http://admin_upstream;
      expires 365d;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      proxy_pass http://admin_upstream;
      limit_conn addr_conn 20;
    }
  }

  # 3. Website Owner Panel (owner.finallinks.com)
  server {
    listen 80;
    server_name owner.finallinks.com;

    # Strict clickjacking defense for owner
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location /_next/static/ {
      proxy_pass http://admin_upstream;
      expires 365d;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      proxy_pass http://admin_upstream;
      limit_conn addr_conn 20;
    }
  }
}
